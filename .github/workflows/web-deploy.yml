name: Deploy admin panel and web preview

# Builds the admin control room (Cloudflare Pages) and the browser preview of the app (Worker) for staging or production.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_URL: ${{ github.event.inputs.target == 'production' && 'https://fatwa-api.ziakhalid236.workers.dev' || 'https://fatwa-api-staging.ziakhalid236.workers.dev' }}
  PAGES_PROJECT: ${{ github.event.inputs.target == 'production' && 'fatwa-admin' || 'fatwa-admin-staging' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build admin panel
        working-directory: artifacts/admin-panel
        run: VITE_API_URL="$API_URL" pnpm exec vite build
      - name: Deploy admin panel (Pages)
        working-directory: artifacts/admin-panel
        run: pnpm dlx wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
      - name: Build app web preview
        working-directory: artifacts/fatwa-mobile
        run: EXPO_PUBLIC_API_URL="$API_URL" CI=1 pnpm exec expo export --platform web --output-dir dist-web --clear
      - name: Deploy app web preview
        if: github.event.inputs.target == 'production' || github.event.inputs.target == 'staging'
        working-directory: artifacts/fatwa-mobile
        run: |
          NAME=fatwa-preview; [ "${{ github.event.inputs.target }}" = "staging" ] && NAME=fatwa-preview-staging
          pnpm dlx wrangler@4 deploy -c wrangler.preview.toml --name "$NAME"
