name: Apply fatwa-api D1 migrations

# Cloudflare Workers Builds owns the Worker deploy for this repository. This
# workflow only applies D1 migrations and smoke-tests the live API, so the two
# do not race to deploy the same Worker.

on:
  push:
    branches: [main]
    paths:
      - 'workers/fatwa-api/migrations/**'
      - '.github/workflows/worker-migrations.yml'
  workflow_dispatch:

concurrency:
  group: worker-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  migrate:
    name: Apply migrations and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping migrations."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Worker dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: workers/fatwa-api
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: workers/fatwa-api
        run: pnpm exec wrangler d1 migrations apply fatwa-web-content --remote

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          base="https://fatwa-api.ziakhalid236.workers.dev/api"
          curl -fsS "$base/health" | grep -q '"ok":true'
          curl -fsS "$base/fatwas" | grep -q '"fatwas"'
          curl -fsS "$base/posts" | grep -q '"posts"'
          echo "Smoke test passed."
