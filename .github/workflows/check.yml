name: Check (typecheck)

# Fast type check of the app, admin panel and API Worker on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: App
        working-directory: artifacts/fatwa-mobile
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Admin panel
        working-directory: artifacts/admin-panel
        run: pnpm exec tsc --noEmit
      - name: API Worker
        working-directory: workers/fatwa-api
        run: pnpm exec tsc --noEmit
