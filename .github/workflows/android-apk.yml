name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  JAVA_VERSION: 17
  # Preview builds only need the ABI real phones use. Building all four
  # (armeabi-v7a, arm64-v8a, x86, x86_64) doubles the native CMake work.
  REACT_NATIVE_ARCHITECTURES: arm64-v8a

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Android project
        working-directory: artifacts/fatwa-mobile
        run: pnpm exec expo prebuild --platform android --no-install --no-clean

      - name: Build release APK
        working-directory: artifacts/fatwa-mobile/android
        run: >-
          ./gradlew assembleRelease
          --no-daemon
          --build-cache
          -PreactNativeArchitectures=${{ env.REACT_NATIVE_ARCHITECTURES }}
          -x lintVitalAnalyzeRelease
          -x lintVitalRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatwa-mobile-preview-apk
          path: artifacts/fatwa-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
