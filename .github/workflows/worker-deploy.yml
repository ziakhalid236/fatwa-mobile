name: Deploy fatwa-api Worker

# Deploys the API Worker to staging or production, connected to the matching Turso databases,
# smoke-tests it and rolls back automatically if the smoke test fails. Run manually from the Actions tab.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the TURSO_* secrets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: worker-deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ github.event.inputs.target }}
      TURSO_APP_URL: ${{ github.event.inputs.target == 'production' && secrets.TURSO_APP_URL || secrets.TURSO_APP_STAGING_URL }}
      TURSO_APP_TOKEN: ${{ github.event.inputs.target == 'production' && secrets.TURSO_APP_TOKEN || secrets.TURSO_APP_STAGING_TOKEN }}
      TURSO_KB_URL: ${{ github.event.inputs.target == 'production' && secrets.TURSO_KB_URL || secrets.TURSO_KB_STAGING_URL }}
      TURSO_KB_TOKEN: ${{ github.event.inputs.target == 'production' && secrets.TURSO_KB_TOKEN || secrets.TURSO_KB_STAGING_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
      ADMIN_TOKEN: ${{ github.event.inputs.target == 'production' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and typecheck
        working-directory: workers/fatwa-api
        run: |
          pnpm install --ignore-workspace --ignore-scripts
          pnpm exec tsc --noEmit

      - name: Check credentials
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TURSO_APP_URL TURSO_APP_TOKEN TURSO_KB_URL TURSO_KB_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done

      - name: Deploy Worker with Turso connections
        working-directory: workers/fatwa-api
        run: |
          if [ "$TARGET" = "production" ]; then ENVFLAG="--env="; else ENVFLAG="--env=staging"; fi
          echo "ENVFLAG=$ENVFLAG" >> "$GITHUB_ENV"
          python3 - <<'PY' > "$RUNNER_TEMP/secrets.json"
          import json, os
          print(json.dumps({"TURSO_DB_URL": os.environ["TURSO_APP_URL"], "TURSO_DB_TOKEN": os.environ["TURSO_APP_TOKEN"],
                            "TURSO_KB_URL": os.environ["TURSO_KB_URL"], "TURSO_KB_TOKEN": os.environ["TURSO_KB_TOKEN"], **{k: os.environ[k] for k in ("ADMIN_TOKEN", "SMTP_USER", "SMTP_PASS", "GOOGLE_CLIENT_IDS") if os.environ.get(k)}}))
          PY
          pnpm exec wrangler deploy $ENVFLAG --keep-vars --secrets-file "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Smoke test
        id: smoke
        run: |
          set -o pipefail
          sleep 8
          if [ "$TARGET" = "production" ]; then base="https://fatwa-api.ziakhalid236.workers.dev/api"; else base="https://fatwa-api-staging.ziakhalid236.workers.dev/api"; fi
          curl -fsS "$base/health" | grep -q '"ok":true'
          curl -fsS "$base/fatwas" | grep -q '"fatwas"'
          curl -fsS "$base/posts" | grep -q '"posts"'
          curl -fsS "$base/library/works" | grep -q '"works"'
          curl -fsS -X POST "$base/chat" -H 'Content-Type: application/json' -d '{"message":"salam","history":[]}' | grep -qv '"error"'
          echo "Smoke test passed."

      - name: Roll back on failure
        if: always() && steps.smoke.conclusion == 'failure'
        working-directory: workers/fatwa-api
        run: 'pnpm exec wrangler rollback $ENVFLAG --message auto-rollback-smoke-test-failed -y'
