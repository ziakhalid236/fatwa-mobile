kind = "mobile"
previewPath = "/fatwa-mobile/"
title = "Fatwa Mobile"
description = "An Android Islamic guidance app inspired by the provided Fatwa reference. Browse answers, explore categories, submit questions, and manage a private profile."
version = "1.0.0"
id = "artifacts/fatwa-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/fatwa-mobile/" ]
localPort = 18561

[services.development]
run = "pnpm --filter @workspace/fatwa-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fatwa-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fatwa-mobile", "run", "serve" ]

[services.env]
PORT = "18561"
BASE_PATH = "/fatwa-mobile/"
